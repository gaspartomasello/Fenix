# Publica el modo solo en GitHub Pages cada vez que algo entra a main: una
# dirección https que anda igual en iOS, Android y la computadora (abrir el
# archivo suelto en el celular es poco confiable). Hay que activar Pages una
# vez: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:solo
      - run: mkdir -p sitio && cp packages/client/dist-solo/fenix.html sitio/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
